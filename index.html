<script>
// Servidores do seu painel, tentados em ordem (igual ao app Android). Deixe [] para sempre pedir o endereço.
const DEFAULT_SERVERS=["http://cdntp.sbs","http://tlfp.fun:80","http://telefunplay.xyz:80","http://xtrem7.sbs","http://benck21.sbs:80"];

const SALES={WHATSAPP:"5562982606779",WHATSAPP_LABEL:"(62) 98260-6779",PIX_KEY:"+5562982606779",PIX_LABEL:"(62) 98260-6779",PIX_TYPE:"Celular",PLAN_NAME:"Plano mensal",PLAN_DAYS:30,BASE:20,EXTRA:10,MAX:4,TRIAL_HOURS:5};

const norm=s=>String(s||'').normalize('NFD').replace(/\p{Mn}+/gu,'').toLowerCase();

const S={api:null,cat:null,acc:null,tab:'home',proxy:false,det:new Map(),play:null,zap:[],
 fav:new Set(LS.get('fav',[])),resume:LS.get('resume',[]),set:{fmt:'ts',scale:'contain',auto:true,secs:10,proxy:true,...LS.get('set',{})},
 f:{live:{c:'',q:'',fav:0},movies:{c:'',q:'',fav:0},series:{c:'',q:'',fav:0},q:''}};
const px=u=>S.proxy&&S.set.proxy?'/proxy?url='+encodeURIComponent(u):u;
const img=u=>location.protocol==='https:'&&/^http:/.test(u)?'/proxy?url='+encodeURIComponent(u):u;
const fmtT=ms=>new Date(ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const b64=x=>{if(!x)return'';try{return new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0))).trim()||x}catch{return x}};

class Xt{
 constructor(s,u,p){let b=s.trim();if(!b.includes('://'))b='http://'+b;this.base=b.split('/player_api.php')[0].split('/get.php')[0].replace(/\/+$/,'');this.u=encodeURIComponent(u.trim());this.p=encodeURIComponent(p)}
 async get(a,x){const r=await fetch(px(`${this.base}/player_api.php?username=${this.u}&password=${this.p}${a?'&action='+a:''}${x?'&'+x:''}`));
  if(!r.ok)throw Error(r.status==401||r.status==403?`Acesso negado (HTTP ${r.status}). Verifique usuário e senha.`:r.status==404?'Endereço não encontrado (HTTP 404). Verifique a URL e a porta.':`Erro do servidor (HTTP ${r.status}).`);return r.json()}
 ts(id,start,min){const f=new Intl.DateTimeFormat('en-CA',{timeZone:S.tz||'UTC',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(start)),g=t=>f.find(x=>x.type==t).value;
  return`${this.base}/timeshift/${this.u}/${this.p}/${min}/${g('year')}-${g('month')}-${g('day')}:${g('hour')}-${g('minute')}/${id}.ts`}
 async fepg(id){try{const r=await this.get('get_simple_data_table','stream_id='+id);return(r.epg_listings||[]).map(o=>({t:b64(o.title),d:b64(o.description),s:(+o.start_timestamp||0)*1000,e:(+o.stop_timestamp||0)*1000,a:v(o.has_archive)==null?true:v(o.has_archive)=='1'})).filter(p=>p.s&&p.e).sort((a,b)=>a.s-b.s)}catch{return[]}}
 url(kind,id,ext){return`${this.base}/${kind=='episode'?'series':kind}/${this.u}/${this.p}/${id}.${ext}`}
 async auth(){const r=await this.get(),i=r.user_info;S.tz=(r.server_info&&v(r.server_info.timezone))||'UTC';if(!i)throw Error('Resposta inválida do servidor. Confira a URL e a porta.');
  if(v(i.auth)!='1')throw Error('Usuário ou senha inválidos.');const st=v(i.status)||'Active';if(st.toLowerCase()=='expired')throw Error('Sua assinatura venceu. Toque em "Renovar" abaixo.');if(st.toLowerCase()!='active')throw Error('Conta com status: '+st+'.');
  return{status:st,exp:+v(i.exp_date)||null,max:v(i.max_connections)}}
 async catalog(){
  const L=a=>this.get(a).then(r=>Array.isArray(r)?r:[]).catch(()=>[]);
  const [lc,vc,sc,ls,vs,ss]=await Promise.all(['get_live_categories','get_vod_categories','get_series_categories','get_live_streams','get_vod_streams','get_series'].map(L));
  const cm=a=>new Map(a.filter(o=>v(o.category_id)).map(o=>[v(o.category_id),v(o.category_name)||'Outros']));
  const mk=(arr,type,idk,cats,fx)=>arr.map(o=>{const id=v(o[idk]);if(!id)return null;const e={id:type+':'+id,sid:id,type,name:v(o.name)||id,cat:cats.get(v(o.category_id))||'Outros',added:+(v(o.added)||v(o.last_modified))||0,...fx(o)};e.key=norm(e.name);return e}).filter(Boolean);
  const [lm,vm,sm]=[cm(lc),cm(vc),cm(sc)];
  const live=mk(ls,'live','stream_id',lm,o=>({poster:v(o.stream_icon),arch:v(o.tv_archive)=='1'?(+v(o.tv_archive_duration)||0):0}));
  const movies=mk(vs,'movie','stream_id',vm,o=>({poster:v(o.stream_icon),year:v(o.year)||v(o.releasedate)?.slice(0,4),rating:v(o.rating),ext:v(o.container_extension)||'mp4'}));
  const series=mk(ss,'series','series_id',sm,o=>({poster:v(o.cover),year:(v(o.releaseDate)||v(o.release_date))?.slice(0,4),rating:v(o.rating),plot:v(o.plot)}));
  const used=(m,l)=>{const u=new Set(l.map(e=>e.cat));return[...new Set([...m.values(),'Outros'])].filter(c=>u.has(c))};
  return{live,movies,series,liveC:used(lm,live),moviesC:used(vm,movies),seriesC:used(sm,series),all:[...live,...movies,...series]}}
 async vod(id){try{const i=(await this.get('get_vod_info','vod_id='+id)).info;if(!i)return null;
  return{plot:v(i.plot)||v(i.description),bg:first(i.backdrop_path),genre:v(i.genre),cast:v(i.cast)||v(i.actors),dir:v(i.director),dur:v(i.duration),rating:v(i.rating),seasons:[]}}catch{return null}}
 async ser(id){try{const r=await this.get('get_series_info','series_id='+id),i=r.info||{},names={};
  (r.seasons||[]).forEach(s=>{if(v(s.name))names[s.season_number]=s.name});
  const ep=r.episodes,ents=Array.isArray(ep)?ep.map((a,k)=>[k+1,a]):Object.entries(ep||{}).sort((a,b)=>(+a[0]||1e9)-(+b[0]||1e9));
  const seasons=ents.map(([k,arr])=>({n:+k,name:names[k]||'Temporada '+k,eps:(arr||[]).map((e,j)=>({id:v(e.id),n:+e.episode_num||j+1,title:v(e.title)||'Episódio '+(j+1),plot:v(e.info?.plot),dur:v(e.info?.duration),img:first(e.info?.movie_image),ext:v(e.container_extension)||'mp4'})).filter(e=>e.id).sort((a,b)=>a.n-b.n)})).filter(s=>s.eps.length);
  return{plot:v(i.plot),bg:first(i.backdrop_path),genre:v(i.genre),cast:v(i.cast),dir:v(i.director),rating:v(i.rating),seasons}}catch{return null}}
 async epg(id){try{const r=await this.get('get_short_epg',`stream_id=${id}&limit=6`);
  return(r.epg_listings||[]).map(o=>({t:b64(o.title),d:b64(o.description),s:(+o.start_timestamp||0)*1000,e:(+o.stop_timestamp||0)*1000})).filter(p=>p.s&&p.e).sort((a,b)=>a.s-b.s)}catch{return[]}}
}

// ---------- Sessão ----------
function loading(t){$('#app').innerHTML=`<div class="cen" style="position:static;min-height:100vh;background:none"><div class="logo">VORTEX <em>▶</em> PLAY</div><p class="muted">${esc(t)}</p></div>`}
function loginView(err,src){const l=LS.get('login',{});src=src||S.src||(l.type=='m3u'?'m3u':'x');S.src=src;const pf=S.prefill||{};
 $('#app').innerHTML=`<div class="cen" style="position:static;min-height:100vh;background:none"><form class="box" id="lf"><div class="logo" style="text-align:center;margin-bottom:6px">VORTEX <em>▶</em> PLAY</div><p class="muted" style="text-align:center;margin:0 0 10px">${src=='m3u'?'Cole o link da sua lista M3U/M3U8.':'Bem-vindo! Acesse com o usuário e a senha da sua assinatura.'}</p>
 <div style="display:flex;gap:8px"><button type="button" class="${src=='x'?'pri':''}" data-src="x" style="flex:1">Usuário e senha</button><button type="button" class="${src=='m3u'?'pri':''}" data-src="m3u" style="flex:1">Lista M3U (link)</button></div>
 ${src=='m3u'?`<label>Link da lista (http://... .m3u)</label><input id="lm" value="${esc(l.url||'')}">`:`<label>Servidor ${DEFAULT_SERVERS.length?'(opcional)':''}</label><input id="ls" placeholder="http://servidor:porta" value="${esc(l.server||'')}"><label>Usuário</label><input id="lu" value="${esc(pf.u||l.user||'')}" autocomplete="username"><label>Senha</label><input id="lp" type="password" value="${esc(pf.p||'')}" autocomplete="current-password">`}
 <p class="err">${esc(err||'')}</p><button class="pri" style="width:100%">Entrar</button>
 <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button type="button" data-acc="TRIAL" style="flex:1">Teste grátis</button><button type="button" data-acc="SUBSCRIBE" style="flex:1">Assinar</button>${/venceu/.test(err||'')?'<button type="button" class="pri" data-acc="RENEW" style="flex:1">Renovar</button>':''}</div>
 ${S.proxy?'':'<p class="muted" style="font-size:12px">Proxy não detectado: abra pelo <code>node server.js</code> para evitar bloqueio de CORS.</p>'}</form></div>`;
 $('#lf').onsubmit=e=>{e.preventDefault();src=='m3u'?connectM3u($('#lm').value):connect($('#ls').value,$('#lu').value,$('#lp').value)}}
async function connect(server,user,pass,keep){
 loading('Conectando...');
 try{const c=[...new Set([server,...DEFAULT_SERVERS].map(s=>(s||'').trim()).filter(Boolean))];if(!c.length)throw Error('Informe o endereço do servidor.');
  let api,acc,err;for(const s of c){try{const a=new Xt(s,user,pass);acc=await a.auth();api=a;break}catch(e){err=e}}if(!api)throw err;
  loading('Carregando catálogo...');const cat=await api.catalog();if(!cat.all.length)throw Error('Nenhum conteúdo encontrado nesta conta.');
  Object.assign(S,{api,acc,m3u:null,cat,by:new Map(cat.all.map(e=>[e.id,e]))});S.det.clear();buildHome();LS.set('login',{server:api.base,user:user.trim(),pass});go('home')}
 catch(e){const m=e instanceof TypeError?'Não foi possível conectar. Abra o app por "node server.js" (o proxy resolve CORS e conteúdo misto).':e.message;
  if(keep&&S.cat){go(S.tab);alert(m)}else loginView(m)}}
function logout(){const l=LS.get('login',{});LS.set('login',{server:l.server,user:l.user});S.api=S.cat=null;closePlayer();$('#modal')?.remove();loginView()}

// ---------- Lista M3U ----------
function m3uParse(txt){let name=null,grp='Outros',logo=null,hdr=false;const raws=[],AT=/([\w-]+)="([^"]*)"/g;
 for(let l of txt.split(/\r?\n/)){l=l.trim();if(!l)continue;if(l.startsWith('#EXTM3U')){hdr=true;continue}
  if(/^#EXTINF/i.test(l)){hdr=true;const at={};l.replace(AT,(m,k,x)=>{at[k.toLowerCase()]=x;return''});const rest=l.replace(AT,''),i=rest.indexOf(',');
   name=(i>=0?rest.slice(i+1).trim():'')||at['tvg-name']||'';grp=(at['group-title']||'').trim()||'Outros';logo=(at['tvg-logo']||'').startsWith('http')?at['tvg-logo'].trim():null;continue}
  if(l[0]=='#')continue;if(/^(https?|rtmp|rtsp|udp):/i.test(l))raws.push({name:name||l.split('/').pop().split('?')[0],grp,logo,url:l});name=null;grp='Outros';logo=null}
 if(!hdr||!raws.length)throw Error('Nenhum canal encontrado nessa lista. Confira se o link é de uma lista M3U.');
 const EP=/^(.*?)[\s._\-]*[Ss](\d{1,2})[\s._\-]*[Ee](\d{1,3})(.*)$/,VF=/\.(mp4|mkv|avi|mov|wmv|flv)(\?.*)?$/i,trim=x=>x.trim().replace(/^[-._ ]+|[-._ ]+$/g,'');
 const hash=u=>{let x=5381;for(const c of u)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)},ext=u=>{const e=u.split('?')[0].split('.').pop();return e.length>=2&&e.length<=4&&/^[a-z0-9]+$/i.test(e)?e.toLowerCase():'mp4'};
 const urls={},live=[],movies=[],sm=new Map(),total=raws.length;
 raws.forEach((r,idx)=>{const lu=r.url.toLowerCase(),ep=EP.exec(r.name);let id='u'+hash(r.url),k=0;while(urls[id]&&urls[id]!==r.url)id='u'+hash(r.url)+(++k);urls[id]=r.url;
  if(ep&&(lu.includes('/series/')||VF.test(r.url)||/serie/i.test(r.grp))){const sn=trim(ep[1])||r.name,key=norm(sn);if(!sm.has(key))sm.set(key,{name:sn,cat:r.grp,logo:r.logo,eps:[]});const s=sm.get(key);s.logo=s.logo||r.logo;s.eps.push({id,sn:+ep[2],n:+ep[3],title:trim(ep[4])||'Episódio '+ep[3],img:r.logo,ext:ext(r.url)})}
  else if(lu.includes('/movie/')||VF.test(r.url))movies.push({id:'movie:'+id,sid:id,type:'movie',name:r.name,cat:r.grp,poster:r.logo,added:total-idx,ext:ext(r.url)});
  else live.push({id:'live:'+id,sid:id,type:'live',name:r.name,cat:r.grp,poster:r.logo,added:total-idx})});
 const series=[],det={};let n=0;for(const s of sm.values()){n++;const sid='s'+n;series.push({id:'series:'+sid,sid,type:'series',name:s.name,cat:s.cat,poster:s.logo,added:total-n});
  const by={};s.eps.forEach(e=>(by[e.sn]=by[e.sn]||[]).push(e));det[sid]={seasons:Object.keys(by).map(Number).sort((a,b)=>a-b).map(k=>({n:k,name:'Temporada '+k,eps:by[k].sort((a,b)=>a.n-b.n)}))}}
 [live,movies,series].forEach(l=>l.forEach(e=>e.key=norm(e.name)));const used=l=>[...new Set(l.map(e=>e.cat))];
 return{cat:{live,movies,series,liveC:used(live),moviesC:used(movies),seriesC:used(series),all:[...live,...movies,...series]},urls,det}}
async function connectM3u(url,keep){loading('Baixando lista...');
 try{url=url.trim();if(!/^https?:\/\//i.test(url))throw Error('Endereço da lista inválido. Use um link começando com http:// ou https://');

 D.d=await getDet(e)||{seasons:[]};if(!$('#detail'))return;drawDetail();if(S.set.tmdb)tmdb(e).then(t=>{if(D&&D.e===e&&t){D.t=t;drawDetail()}})}
function drawDetail(){const{e,d}=D,o=$('#detail');const bg=(D.t&&D.t.bg)||(d&&d.bg);if(bg)o.style.backgroundImage=`url("${img(bg)}")`;
 const s=d?.seasons?.[D.si],r=e.type=='movie'?resPos(e.id):null;
 o.innerHTML=`<div><div class="in"><button data-act="back">← Voltar</button><div style="display:flex;gap:22px;margin-top:20px;flex-wrap:wrap"><img src="${esc(img((D.t&&D.t.poster)||e.poster||''))}" referrerpolicy="no-referrer" style="width:200px;border-radius:10px;align-self:flex-start" onerror="this.remove()" alt="">
 <div style="flex:1;min-width:260px"><h1 style="margin:0 0 6px">${esc(e.name)}</h1><p class="muted">${[e.year,((D.t&&D.t.rating)||(d&&d.rating))&&'★ '+((D.t&&D.t.rating)||d.rating),d?.dur,d?.genre].filter(Boolean).map(esc).join(' • ')}</p>
 <p style="color:var(--t2)">${d?esc((D.t&&D.t.plot)||d.plot||e.plot||'Sem sinopse.'):'Carregando...'}</p>${D.t&&D.t.cast.length?`<p class="muted"><b>Elenco:</b> ${D.t.cast.map(c=>esc(c.n)+(c.ch?' ('+esc(c.ch)+')':'')).join(', ')}</p>`:d?.cast?`<p class="muted"><b>Elenco:</b> ${esc(d.cast)}</p>`:''}${d?.dir?`<p class="muted"><b>Direção:</b> ${esc(d.dir)}</p>`:''}
 <div style="display:flex;gap:8px;flex-wrap:wrap">${e.type=='movie'?`<button class="pri" data-act="dplay">▶ ${r?'Continuar':'Assistir'}</button>`:''}<button data-fav="${e.id}">${S.fav.has(e.id)?'✓ Na lista':'+ Minha lista'}</button>${D.t&&D.t.yt?`<a href="https://www.youtube.com/watch?v=${D.t.yt}" target="_blank" rel="noopener"><button type="button">▶ Trailer</button></a>`:''}</div></div></div>
 ${e.type=='series'&&d?.seasons.length?`<h2>Episódios</h2><select id="ss">${d.seasons.map((x,i)=>`<option value="${i}" ${i==D.si?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div style="margin-top:10px">${s.eps.map((ep,i)=>{const p=resPos('episode:'+ep.id);return`<div class="ep" data-ep="${i}"><b style="width:28px">${ep.n}</b><div style="flex:1"><div>${esc(ep.title)} <span class="muted">${esc(ep.dur||'')}</span></div><small>${esc((ep.plot||'').slice(0,160))}</small></div>${p?`<div class="pg"><i style="width:${p.dur?p.pos/p.dur*100:30}%"></i></div>`:''}</div>`}).join('')}</div>`:e.type=='series'&&d?'<p class="muted">Nenhum episódio encontrado.</p>':''}</div></div>`;
 $('#ss')&&($('#ss').onchange=x=>{D.si=+x.target.value;drawDetail()})}

// ---------- Player ----------
let hls,mp,hideT,epgT,cdT;
function killEngines(){hls?.destroy();hls=null;try{mp?.destroy()}catch{}mp=null;clearInterval(epgT);clearInterval(cdT)}
function startPlay(req){$('#detail')&&0;closePlayer(1);S.play=req;const o=document.createElement('div');o.id='pl';
 o.innerHTML=`<video id="v" controls autoplay playsinline></video><div class="top"><button data-act="pclose">←</button><div style="flex:1"><b>${esc(req.title)}</b><small>${esc(req.sub||'')}</small></div>${req.kind=='live'?'<button data-act="zp" data-d="-1">◀ Canal</button><button data-act="zp" data-d="1">Canal ▶</button>':''}<button data-act="scale" title="Ajustar/Preencher/Esticar">⤢</button>${document.pictureInPictureEnabled?'<button data-act="pip" title="Janela flutuante (PiP)">⧉</button>':''}<button data-act="fs">⛶</button></div><div class="pe" id="pe" hidden></div>
 <div class="cen" id="perr" hidden><p class="err">Falha na reprodução. Verifique a conexão e o formato (em Configurações) ou tente de novo.</p><button class="pri" data-act="retry">Tentar novamente</button></div><div class="cen" id="nx" hidden></div>`;
 document.body.appendChild(o);const vid=$('#v');vid.style.objectFit=S.set.scale;let last=0;
 const fail=()=>{$('#perr').hidden=false};vid.onerror=fail;vid.onplaying=()=>{$('#perr').hidden=true};
 vid.ontimeupdate=()=>{if(req.kind!='live'&&req.kind!='catchup'&&Date.now()-last>5000){last=Date.now();saveProg(req,vid.currentTime*1000,vid.duration*1000)}};
 vid.onended=()=>onEnded(req);vid.onloadedmetadata=()=>{const r=resPos(req.key);if(req.kind!='live'&&r&&(!vid.duration||r.pos<vid.duration*1000*.95))vid.currentTime=r.pos/1000};
 try{navigator.mediaSession.metadata=new MediaMetadata({title:req.title,artist:req.sub||''});navigator.mediaSession.setActionHandler('enterpictureinpicture',()=>vid.requestPictureInPicture())}catch{}
 const src=px(S.m3u?S.m3u[req.ref]:req.kind=='catchup'?S.api.ts(req.ref,req.cu.s,req.cu.m):S.api.url(req.kind,req.ref,req.ext));
 if(req.ext=='m3u8'&&window.Hls&&Hls.isSupported()){hls=new Hls({liveSyncDurationCount:3});hls.loadSource(src);hls.attachMedia(vid);hls.on(Hls.Events.ERROR,(_,d)=>d.fatal&&fail())}
 else if(req.ext=='ts'&&window.mpegts&&mpegts.isSupported()){mp=mpegts.createPlayer({type:'mpegts',isLive:req.kind=='live',url:src});mp.attachMediaElement(vid);mp.on(mpegts.Events.ERROR,fail);mp.load();vid.play().catch(()=>{})}
 else vid.src=src;
 if(req.kind=='live'&&S.api){const t=async()=>{const p=await S.api.epg(req.ref),n=Date.now(),i=p.findIndex(x=>x.s<=n&&n<x.e),pe=$('#pe');if(!pe||i<0){pe&&(pe.hidden=true);return}
  pe.hidden=false;pe.innerHTML=`<b>${esc(p[i].t)}</b> <small>${fmtT(p[i].s)}–${fmtT(p[i].e)}</small>${p[i+1]?`<small style="display:block">A seguir: ${esc(p[i+1].t)} (${fmtT(p[i+1].s)})</small>`:''}`};t();epgT=setInterval(t,60000)}
 const sh=()=>{o.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>o.classList.add('hide'),3000)};o.onmousemove=sh;sh()}
function closePlayer(keep){const v=$('#v');if(v&&S.play&&S.play.kind!='live'&&S.play.kind!='catchup')saveProg(S.play,v.currentTime*1000,v.duration*1000);killEngines();$('#pl')?.remove();if(!keep){S.play=null;if(S.tab=='home'&&S.cat)homeView();if($('#detail'))drawDetail()}}
function saveProg(r,pos,dur){if(r.kind=='live'||r.kind=='catchup'||pos<5000)return;dur=dur>0?dur:0;
 if(dur&&pos>dur*.95)S.resume=S.resume.filter(x=>x.key!=r.key);else S.resume=[{...r,pos,dur,at:Date.now()},...S.resume.filter(x=>x.key!=r.key)].slice(0,30);LS.set('resume',S.resume)}
async function onEnded(req){S.resume=S.resume.filter(x=>x.key!=req.key);LS.set('resume',S.resume);if(req.kind=='live')return;
 let nx=null;if(req.kind=='episode'&&S.set.auto){const se=S.cat.series.find(s=>s.sid==req.sid),d=se&&await getDet(se);if(d){const f=d.seasons.flatMap(s=>s.eps.map(ep=>[s,ep])),i=f.findIndex(x=>x[1].id==req.ref);if(f[i+1])nx=epReq(se,f[i+1][0],f[i+1][1])}}
 if(S.play?.key!=req.key)return;if(!nx)return closePlayer();let n=S.set.secs;const b=$('#nx');b.hidden=false;
 const draw=()=>b.innerHTML=`<p>A seguir: <b>${esc(nx.sub)}</b></p><p class="muted">Começa em ${n}s</p><div><button class="pri" id="nxy">Assistir agora</button> <button id="nxn">Cancelar</button></div>`;draw();
 $('#nx').onclick=e=>{if(e.target.id=='nxy'){clearInterval(cdT);startPlay(nx)}if(e.target.id=='nxn'){clearInterval(cdT);closePlayer()}};
 cdT=setInterval(()=>{if(--n<=0){clearInterval(cdT);startPlay(nx)}else draw()},1000)}
function zap(d){const r=S.play;if(!r||r.kind!='live'||S.zap.length<2)return;const i=S.zap.findIndex(e=>e.sid==r.ref);if(i<0)return;startPlay(reqFor(S.zap[((i+d)%S.zap.length+S.zap.length)%S.zap.length]))}

// ---------- Configurações ----------
function settings(){const a=S.acc,m=document.createElement('div');m.className='ov m';m.id='modal';
 m.innerHTML=`<div class="box"><h2 style="margin-top:0">Configurações</h2><p class="muted">${a?`Conta: ${esc(a.status)} • vence em ${a.exp?new Date(a.exp*1000).toLocaleDateString('pt-BR'):'—'} • conexões: ${esc(a.max||'—')}<br>Servidor: ${esc(S.api.base)}`:'Fonte: lista M3U'}<br>Catálogo: ${S.cat.live.length} canais • ${S.cat.movies.length} filmes • ${S.cat.series.length} séries</p>
 <label>Formato do canal ao vivo</label><select id="s1"><option value="ts">TS (mpegts)</option><option value="m3u8">HLS (m3u8)</option></select>
 <label>Tamanho do vídeo</label><select id="s2"><option value="contain">Ajustar</option><option value="cover">Preencher (zoom)</option><option value="fill">Esticar</option></select>
 <label><input type="checkbox" id="s3" style="width:auto"> Próximo episódio automático</label><label>Contagem regressiva (segundos)</label><input id="s4" type="number" min="3" max="60" value="${S.set.secs}">
 <label><input type="checkbox" id="s5" style="width:auto"> Usar proxy local ${S.proxy?'':'(indisponível: abra via node server.js)'}</label>
 <label>Chave TMDB (opcional: capa HD, elenco e trailer)</label><input id="s6" value="${esc(S.set.tmdb||'')}" placeholder="cole sua chave da API do themoviedb.org"><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="pri" data-act="sclose">Salvar</button>${S.api?'<button data-acc="RENEW">Renovar assinatura</button>':''}<button data-act="reload">Atualizar catálogo</button><button data-act="logout">Sair</button></div></div>`;
 document.body.appendChild(m);$('#s1').value=S.set.fmt;$('#s2').value=S.set.scale;$('#s3').checked=S.set.auto;$('#s5').checked=S.set.proxy&&S.proxy;$('#s5').disabled=!S.proxy}
function saveSettings(){if(!$('#s1')){$('#modal')?.remove();return}S.set={...S.set,fmt:$('#s1').value,scale:$('#s2').value,auto:$('#s3').checked,secs:Math.max(3,+$('#s4').value||10),proxy:$('#s5').checked,tmdb:$('#s6').value.trim()};LS.set('set',S.set);$('#modal').remove()}

// ---------- Eventos ----------
let epgTimer;
document.addEventListener('click',async e=>{const t=e.target,c=s=>t.closest(s);let x;
 if(x=c('[data-src]'))return loginView('',x.dataset.src);
 if(x=c('[data-acc]'))return access(x.dataset.acc,(S.prefill&&S.prefill.u)||LS.get('login',{}).user);
 if(x=c('[data-pg]')){const[gi,pi]=x.dataset.pg.split('|'),ch=GR[+gi];return progDlg(ch,S.epgc[ch.sid][+pi])}
 if(x=c('[data-fav]'))return e.stopPropagation(),toggleFav(x.dataset.fav);
 if(x=c('[data-tab]'))return go(x.dataset.tab);
 if(x=c('[data-resume]')){const r=S.resume.find(r=>r.key==x.dataset.resume);return r&&startPlay(r)}
 if(c('[data-hplay]')){const h=S.hero;return h.type=='movie'?startPlay(reqFor(h)):openDetail(h)}
 if(x=c('[data-ep]')){const s=D.d.seasons[D.si];return startPlay(epReq(D.e,s,s.eps[+x.dataset.ep]))}
 if(x=c('[data-open]')){const en=S.by.get(x.dataset.open);return en&&openDetail(en)}
 if(!(x=c('[data-act]')))return;const a=x.dataset.act;
 if(a=='settings')settings();else if(a=='sclose')saveSettings();else if(a=='back'){$('#detail')?.remove();D=null}
 else if(a=='dplay')startPlay(reqFor(D.e));else if(a=='pclose')closePlayer();else if(a=='retry')startPlay(S.play);
 else if(a=='pip'){const vd=$('#v');try{document.pictureInPictureElement?await document.exitPictureInPicture():await vd.requestPictureInPicture()}catch{alert('Seu navegador não conseguiu abrir o PiP para este vídeo.')}}
 else if(a=='fs'){const p=$('#pl');document.fullscreenElement?document.exitFullscreen():p.requestFullscreen?.()}
 else if(a=='scale'){const o=['contain','cover','fill'];S.set.scale=o[(o.indexOf(S.set.scale)+1)%3];LS.set('set',S.set);$('#v').style.objectFit=S.set.scale}
 else if(a=='zp')zap(+x.dataset.d);else if(a=='reload'){saveSettings();const l=LS.get('login');l.type=='m3u'?connectM3u(l.url,true):connect(l.server,l.user,l.pass,true)}
 else if(a=='logout')logout()});
document.addEventListener('mouseover',e=>{const x=e.target.closest('[data-epg]');if(!x||!$('#epg')||!S.api)return;clearTimeout(epgTimer);epgTimer=setTimeout(async()=>{const p=await S.api.epg(x.dataset.epg),n=Date.now(),en=S.by.get('live:'+x.dataset.epg);if(!$('#epg'))return;
 $('#epg').innerHTML=`<h3>${esc(en?.name||'Programação')}</h3>`+(p.filter(q=>q.e>n).map(q=>`<div class="pr"><b>${esc(q.t)}</b><small>${fmtT(q.s)}–${fmtT(q.e)}${q.s<=n?' • no ar':''}</small><small>${esc(q.d.slice(0,140))}</small></div>`).join('')||'<p class="muted">Sem programação disponível.</p>')},350)});
document.addEventListener('keydown',e=>{const vid=$('#v');if(!vid||/INPUT|SELECT/.test(e.target.tagName))return;const live=S.play?.kind=='live',k=e.key;
 if(k==' '){e.preventDefault();vid.paused?vid.play():vid.pause()}else if(k=='Escape'&&!document.fullscreenElement)closePlayer();
 else if(k=='ArrowRight'&&!live)vid.currentTime+=10;else if(k=='ArrowLeft'&&!live)vid.currentTime-=10;
 else if(k=='ArrowUp'||k=='PageUp'){e.preventDefault();live?zap(-1):vid.volume=Math.min(1,vid.volume+.1)}else if(k=='ArrowDown'||k=='PageDown'){e.preventDefault();live?zap(1):vid.volume=Math.max(0,vid.volume-.1)}
 else if(k=='p'||k=='P')document.querySelector('[data-act=pip]')?.click();else if(k=='f'||k=='F')document.querySelector('[data-act=fs]').click();else if(k=='m'||k=='M')vid.muted=!vid.muted});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.play?.kind!='live'&&!document.pictureInPictureElement)$('#v')?.pause()});

(async()=>{S.proxy=await fetch('/api/ping').then(r=>r.ok?r.text():'').then(t=>t=='ok').catch(()=>false);
 LS.get('rem',[]).forEach(schedRem);const l=LS.get('login');l&&l.type=='m3u'&&l.url?connectM3u(l.url):l&&l.pass?connect(l.server,l.user,l.pass):loginView()})();
</script></body></html>
